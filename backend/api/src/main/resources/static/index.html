<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园生活百事通</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <h1>校园生活百事通</h1>

    <div class="tabs">
      <button class="tab active" data-target="login-panel">登录/注册</button>
      <button class="tab" data-target="home-panel">首页问答</button>
      <button class="tab" data-target="hot-panel">热点榜</button>
      <button class="tab user-tab" data-target="contribution-panel">用户贡献</button>
      <button class="tab admin-tab" data-target="audit-panel">后台审核</button>
      <button class="tab" data-target="center-panel">个人中心</button>
    </div>

    <main class="content">
      <!-- 登录注册 -->
      <section id="login-panel" class="panel active">
        <h2>系统登录/注册</h2>

        <div class="form-row">
          <label>登录身份</label>
          <div class="role-box">
            <label><input type="radio" name="role" value="USER" checked> 普通用户</label>
            <label><input type="radio" name="role" value="ADMIN"> 管理员</label>
          </div>
        </div>

        <div class="form-row">
          <label for="username">账号</label>
          <input id="username" type="text" placeholder="请输入账号">
        </div>

        <div class="form-row">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码">
        </div>

        <div class="button-row">
          <button id="loginBtn">登录</button>
          <button id="registerBtn">注册账号</button>
          <button id="logoutBtn" class="gray-btn">退出登录</button>
        </div>

        <p class="tip">说明：登录成功后会保存 JWT Token，管理员身份可以进入后台审核页面。</p>
      </section>

      <!-- 首页问答 -->
      <section id="home-panel" class="panel">
        <h2>智能问答</h2>

        <div class="qa-box">
          <input id="question" type="text" placeholder="请输入你的问题，例如：食堂几点关门？">
          <button id="askBtn">发送</button>
        </div>

        <div class="example-box">
          <span>示例问题：</span>
          <button class="example-question">图书馆开放时间</button>
          <button class="example-question">校园卡丢了怎么办</button>
          <button class="example-question">宿舍报修流程</button>
        </div>

        <textarea id="answer" readonly placeholder="问答结果会显示在这里"></textarea>

        <div class="feedback-box">
          <span>答案反馈：</span>
          <button id="goodBtn">有帮助</button>
          <button id="badBtn">没帮助</button>
        </div>
      </section>

      <!-- 热点榜 -->
      <section id="hot-panel" class="panel">
        <h2>热点榜</h2>
        <button id="loadHotBtn">加载热点问题</button>

        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>问题</th>
              <th>热度</th>
            </tr>
          </thead>
          <tbody id="hotBody"></tbody>
        </table>
      </section>

      <!-- 用户贡献 -->
      <section id="contribution-panel" class="panel">
        <h2>用户贡献</h2>

        <div class="form-row">
          <label for="conQuestion">问题标题</label>
          <input id="conQuestion" type="text" placeholder="请输入问题标题">
        </div>

        <div class="form-row top">
          <label for="conAnswer">答案内容</label>
          <textarea id="conAnswer" placeholder="请输入答案内容"></textarea>
        </div>

        <div class="form-row">
          <label for="conCategory">分类</label>
          <input id="conCategory" type="text" placeholder="例如：生活服务、学习资源">
        </div>

        <button id="submitConBtn">提交贡献</button>
        <p class="tip no-left">提交后需要管理员审核，通过后才会进入知识库。</p>
      </section>

      <!-- 后台审核 -->
      <section id="audit-panel" class="panel">
        <h2>后台审核</h2>
        <p class="tip no-left">只有管理员登录后才能查看和审核用户提交的内容。</p>

        <button id="loadAuditBtn">加载审核列表</button>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>问题</th>
              <th>提交用户</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="auditBody"></tbody>
        </table>
      </section>

      <!-- 个人中心 -->
      <section id="center-panel" class="panel">
        <h2>个人中心</h2>

        <div class="user-card">
          <p>当前账号：<span id="currentUser">未登录</span></p>
          <p>当前身份：<span id="currentRole">游客</span></p>
          <p>Token 状态：<span id="tokenState">无 Token</span></p>
        </div>
      </section>
    </main>
  </div>

  <script src="./script.js"></script>
</body>
</html>
