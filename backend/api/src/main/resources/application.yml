server:
  port: 8080

spring:
  application:
    name: icampus-api

  # 数据源配置（开发阶段使用 H2 内存数据库，正式部署切换 MySQL）
  datasource:
    url: jdbc:h2:mem:icampus;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 控制台（开发调试用，访问 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # MySQL 数据源（正式部署时取消注释）
  # datasource:
  #   url: jdbc:mysql://localhost:3306/icampus?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: root
  #   password: your_password

# JWT 配置
jwt:
  secret: icampus-jwt-secret-key-2024-min-length-32
  expiration-ms: 86400000  # 24小时

# 日志
logging:
  level:
    com.icampus: DEBUG
    org.springframework.security: INFO
