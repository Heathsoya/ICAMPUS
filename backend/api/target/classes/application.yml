server:
  port: 8080

spring:
  application:
    name: icampus-api
  datasource:
    url: jdbc:mysql://localhost:3306/icampus?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  secret: icampus-jwt-secret-key-2024-min-length-32
  expiration-ms: 86400000  # 24小时

# 日志
logging:
  level:
    com.icampus: DEBUG
    org.springframework.security: INFO
